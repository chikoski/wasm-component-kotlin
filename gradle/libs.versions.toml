[versions]
kotlin = "2.2.0"
kotlinpoet = "2.2.0"
kotlinx-serialization = "1.8.0"
clikt = "5.0.3"
junit = "5.11.4"
chicory = "1.7.5"
android-gradle-api = "8.7.3"

[libraries]
android-api-signature = "net.sf.androidscents.signature:android-api-level-26:8.0.0_r2"
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-wasi = { module = "com.dylibso.chicory:wasi", version.ref = "chicory" }
chicory-compiler = { module = "com.dylibso.chicory:compiler", version.ref = "chicory" }
chicory-build-time-compiler = { module = "com.dylibso.chicory:build-time-compiler", version.ref = "chicory" }
chicory-wasm = { module = "com.dylibso.chicory:wasm", version.ref = "chicory" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "android-gradle-api" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Checks that runtime-api / runtime-chicory only call APIs Android's minSdk has (#80).
animalsniffer = { id = "ru.vyarus.animalsniffer", version = "2.0.0" }
