[versions]
kotlin = "2.4.21"
kotlinpoet = "2.4.0"
kotlinx-serialization = "1.13.0"
clikt = "5.1.0"
junit = "5.11.4"
chicory = "1.7.5"
# ASM 9.11+ hardcodes ComputeLimits(10MB, 100M ops) in ClassWriter, throwing LimitExceededException:
# Too many operations in Chicory 1.7.5's Compiler.compileExtraClass on png-glitch-component.wasm.
# AGP 9.5.1 also ships ASM 9.9.
asm = "9.9.1"
kotlinx-coroutines = "1.11.0"
android-gradle-api = "9.5.1"

[libraries]
android-api-signature = "net.sf.androidscents.signature:android-api-level-26:8.0.0_r2"
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-wasi = { module = "com.dylibso.chicory:wasi", version.ref = "chicory" }
chicory-compiler = { module = "com.dylibso.chicory:compiler", version.ref = "chicory" }
chicory-build-time-compiler = { module = "com.dylibso.chicory:build-time-compiler", version.ref = "chicory" }
chicory-wasm = { module = "com.dylibso.chicory:wasm", version.ref = "chicory" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "android-gradle-api" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# Generated bindings of worlds with streams or futures use Flow and Deferred (ADR-0006, #16).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Checks that runtime-api / runtime-chicory only call APIs Android's minSdk has (#80).
animalsniffer = { id = "ru.vyarus.animalsniffer", version = "2.0.1" }
