[package]
name = "wasm2kt-wasmtime-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "wasm2kt_wasmtime_bridge"
crate-type = ["cdylib"]

[dependencies]
wasmtime = { version = "=48.0.8", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
jni = "0.21"

[lints.clippy]
# The extern "C" / JNI entry points take raw pointers from the Kotlin bridge, which owns their
# validity contract (documented on each function); marking them `unsafe fn` would not change what
# foreign callers can do, so this lint only adds noise for an FFI crate.
not_unsafe_ptr_arg_deref = "allow"
