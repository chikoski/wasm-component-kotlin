[package]
name = "wasm2kt-wasmtime-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "wasm2kt_wasmtime_bridge"
crate-type = ["cdylib"]

[dependencies]
wasmtime = { version = "29.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
jni = "0.21"
