# The generic bridge (any component, no build step) and the core it shares with the typed bridges
# that tooling generates per project (ADR-0015, ADR-0016).
[workspace]
members = [".", "core"]
default-members = [".", "core"]
resolver = "2"

[workspace.lints.clippy]
# The extern "C" / JNI entry points take raw pointers from the Kotlin bridge, which owns their
# validity contract (documented on each function); marking them `unsafe fn` would not change what
# foreign callers can do, so this lint only adds noise for an FFI crate.
not_unsafe_ptr_arg_deref = "allow"
# The C ABI and JNI entry points mirror the Kotlin side's signatures.
too_many_arguments = "allow"

[package]
name = "wasm2kt-wasmtime-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "wasm2kt_wasmtime_bridge"
crate-type = ["cdylib"]

[dependencies]
wasm2kt-bridge-core = { path = "core" }

[lints]
workspace = true
