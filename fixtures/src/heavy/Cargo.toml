[package]
name = "heavy-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
regex = "1.11"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[workspace]
