name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Gradle daemon JVM comes from gradle/gradle-daemon-jvm.properties (JDK 21); setup-java provides it.

jobs:
  jvm:
    name: JVM modules + Gradle plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Everything except integration-tests, which need native tools (see the `native` job).
      # Includes the gradle-plugin functional tests (TestKit builds of a consumer project).
      - run: ./gradlew check -x :integration-tests:test --continue
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"

  decomposer:
    name: Decomposer outputs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (decomposer/rust-toolchain.toml)
        working-directory: decomposer
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decomposer
      - name: Lint and test the decomposer
        working-directory: decomposer
        run: |
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
      # The bundled wasm and runtime-chicory's test components are generated and committed;
      # rebuild both and require that nothing changes. The wasm build is reproducible (see build-wasm.sh).
      - run: decomposer/build-wasm.sh
      - run: decomposer/regenerate-fixtures.sh
      - name: Check for stale generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated decomposer outputs are stale. Run decomposer/build-wasm.sh and decomposer/regenerate-fixtures.sh, then commit the result."
            exit 1
          fi

  native:
    name: Generator + Wasmtime bridge
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned Rust toolchain (rust-bridge/rust-toolchain.toml)
        working-directory: rust-bridge
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bridge
      # integration-tests generate bindings with wasm-tools and run them on Wasmtime and Chicory.
      # Pinned so results don't change when a new release tightens validation. Independent of the
      # Wasmtime LTS that the decomposer and the bridge share (ADR-0010).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0
      - name: Lint and test the bridge
        working-directory: rust-bridge
        run: |
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
      - run: cargo build --locked --release --manifest-path rust-bridge/Cargo.toml
      - run: ./gradlew :integration-tests:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: integration-tests/build/reports/tests/

  android:
    name: Android sample (build, JVM tests, R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK and sets ANDROID_HOME.
      - run: ./gradlew -p samples/android :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: samples/android/app/build/reports/

  emulator:
    name: Android sample on an emulator (ART)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Build first so the emulator only has to run the tests.
      - run: ./gradlew -p samples/android :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew -p samples/android :app:connectedAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: samples/android/app/build/reports/androidTests/
