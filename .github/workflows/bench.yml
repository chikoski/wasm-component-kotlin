name: Bench

# Performance measurements (#19, docs/performance.md). Not part of CI: run it by hand
# (Actions > Bench > Run workflow) or by pushing a perf/** branch. Results are uploaded as artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["perf/**"]

permissions:
  contents: read

jobs:
  jvm:
    name: JVM (Chicory, Wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the pinned Rust toolchain (rust-bridge/rust-toolchain.toml)
        working-directory: rust-bridge
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bridge
      - run: cargo build --locked --release --manifest-path rust-bridge/Cargo.toml
      - run: ./gradlew -Pwasm2kt.bench :benchmarks:bench :benchmarks:coldStart
      # Wasmtime's typed bridge (ADR-0016), built with cargo; its own JVM loads only that library.
      - run: ./gradlew -Pwasm2kt.bench :benchmarks:benchTyped
      # HotSpot does not JIT methods over 8000 bytes of bytecode; large wasm functions compile to such
      # methods. Repeat the compute benchmarks with that limit lifted.
      - run: >-
          ./gradlew -Pwasm2kt.bench :benchmarks:bench -Pwasm2kt.bench.filter=compute/.*/chicory-aot
          -Pwasm2kt.bench.outFile=calls-huge-methods.tsv "-Pwasm2kt.bench.jvmArgs=-XX:-DontCompileHugeMethods"
      - run: ./gradlew -Pwasm2kt.bench :benchmarks:profile -Pwasm2kt.bench.filter=regex
      - uses: actions/upload-artifact@v7
        with:
          name: bench-jvm
          path: |
            benchmarks/build/results/
            benchmarks/build/bench-gen/build-stats.tsv

  art:
    name: ART (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew -p samples/android :benchmark:assembleReleaseAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: samples/android/benchmark/run-on-device.sh "$GITHUB_WORKSPACE/bench-art"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-art
          path: bench-art/
